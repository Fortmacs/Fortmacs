name: CI

# Pull requests run the whole matrix, but not while they are drafts; main
# runs it again after each merge.  Pushes that only touch documentation
# run nothing, nor do pushes that only touch the progress tooling (used only
# by the Progress workflow on main), and a new push cancels the PR's older
# run.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", tools/progress.sh, tools/package-totals, tools/ported-packages]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**.md", "docs/**", tools/progress.sh, tools/package-totals, tools/ported-packages]

# Draft runs (skipped) are in their own group, so they never cancel the
# run started when a PR is marked ready.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FPM_VERSION: "0.13.0"
  # sha256 of fpm-${FPM_VERSION}.F90, as published with the fpm release.
  FPM_SHA256: "001cff6cf1145f215baa0888ba27acc06cea30a89b79d1a8be97db3fffbc8cd2"
  FPRETTIFY_VERSION: "0.3.7"
  FORTITUDE_VERSION: "0.9.2"

jobs:
  check:
    name: check (${{ matrix.distro }}, ${{ matrix.arch }})
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu runs on the runner itself; the others in containers.  Arch
        # Linux publishes no official aarch64 image.
        include:
          - { distro: ubuntu, arch: x86-64, runner: ubuntu-24.04 }
          - { distro: ubuntu, arch: aarch64, runner: ubuntu-24.04-arm }
          - { distro: fedora, arch: x86-64, runner: ubuntu-24.04, image: "fedora:latest" }
          - { distro: fedora, arch: aarch64, runner: ubuntu-24.04-arm, image: "fedora:latest" }
          - { distro: arch, arch: x86-64, runner: ubuntu-24.04, image: "archlinux:latest" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install packages (Ubuntu)
        if: matrix.distro == 'ubuntu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gfortran valgrind pipx

      - name: Install packages (Fedora)
        if: matrix.distro == 'fedora'
        run: dnf install -y -q gcc-gfortran valgrind pipx git curl ncurses-base which

      - name: Install packages (Arch)
        if: matrix.distro == 'arch'
        # Arch strips ld.so, so valgrind needs glibc's debug info, which Arch
        # serves over debuginfod.  Arch's pipx needs python-filelock, which
        # its package doesn't pull in.
        run: |
          pacman -Syu --noconfirm --needed gcc-fortran valgrind debuginfod python-pipx python-filelock git curl ncurses which
          echo "DEBUGINFOD_URLS=https://debuginfod.archlinux.org" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - name: Show compiler
        run: gfortran --version | sed -n 1p

      # fpm ships no aarch64 binaries, so build it from the single-file
      # release source and cache the result (per distro: each has its own
      # gfortran runtime).
      - name: Cache fpm
        id: fpm-cache
        uses: actions/cache@v6
        with:
          path: ~/.local/bin/fpm
          key: fpm-${{ env.FPM_VERSION }}-${{ matrix.distro }}-${{ runner.arch }}

      - name: Build fpm
        if: steps.fpm-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSLf -o fpm.F90 \
            "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/fpm-${FPM_VERSION}.F90"
          echo "${FPM_SHA256}  fpm.F90" | sha256sum -c -
          mkdir -p ~/.local/bin fpm-mod
          gfortran -O1 -fopenmp -J fpm-mod -o ~/.local/bin/fpm fpm.F90
          rm -rf fpm.F90 fpm-mod

      - name: Install fprettify and Fortitude
        run: |
          pipx install "fprettify==${FPRETTIFY_VERSION}"
          pipx install "fortitude-lint==${FORTITUDE_VERSION}"

      - name: Format, lint, build, test, and test under valgrind
        shell: bash
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          fpm --version | sed -n 1p
          # (sed, not head, for version lines: pipefail would turn head's early
          # exit into a SIGPIPE failure.)
          # On failure, repeat the end of the output as an annotation, so it
          # shows on the PR's checks page without opening the full log.
          set -o pipefail
          # On main, valgrind also runs all the suites in one process (a
          # leak one suite after another causes); a PR runs each suite
          # under valgrind on its own, the suites in parallel.
          memcheck=--valgrind
          if [ "${{ github.event_name }}" = push ]; then memcheck=--valgrind-combined; fi
          if ! tools/check.sh "$memcheck" 2>&1 | tee check.log; then
            tail -n 60 check.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' \
              | sed -e 's/^/::error title=tools\/check.sh failed::/'
            exit 1
          fi
