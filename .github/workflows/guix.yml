name: Guix

# Weekly, and on demand: build and test with the latest Guix toolchain.
# Too slow for every PR (it pulls Guix and fetches the toolchain); style
# is checked by the main CI.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  FPM_VERSION: "0.13.0"
  FPM_SHA256: "001cff6cf1145f215baa0888ba27acc06cea30a89b79d1a8be97db3fffbc8cd2"

jobs:
  check:
    name: check (guix, x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Install Guix
        run: |
          curl -sSLf -o guix-install.sh \
            "https://git.savannah.gnu.org/cgit/guix.git/plain/etc/guix-install.sh"
          chmod +x guix-install.sh
          # Accept the defaults, including substitutes from the build farm.
          yes | sudo ./guix-install.sh
          guix --version | head -1

      - name: Update Guix
        run: guix pull && hash guix && guix describe

      - name: Build and test in a Guix environment
        run: |
          guix shell gfortran-toolchain valgrind curl coreutils bash grep sed findutils \
            ncurses -- bash -euc '
              gfortran --version | head -1
              curl -sSLf -o fpm.F90 \
                "https://github.com/fortran-lang/fpm/releases/download/v${FPM_VERSION}/fpm-${FPM_VERSION}.F90"
              echo "${FPM_SHA256}  fpm.F90" | sha256sum -c -
              mkdir -p "$HOME/.local/bin" fpm-mod
              gfortran -O1 -fopenmp -J fpm-mod -o "$HOME/.local/bin/fpm" fpm.F90
              rm -rf fpm.F90 fpm-mod
              export PATH="$HOME/.local/bin:$PATH"
              tools/check.sh --valgrind --no-style'
