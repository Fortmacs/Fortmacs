name: Progress

# After each merge, redraw the README's progress block and pie charts
# (tools/progress.sh --update-readme) and the index of the status files
# (tools/status.sh --index, docs/progress/status-index.md), regenerate the
# list of unported commands (tools/unported-commands.sh,
# tools/unported-commands), and commit them to main. Branches never touch
# them, so open PRs don't conflict over them.
#
# The push uses the repository secret PROGRESS_TOKEN: a fine-grained
# personal access token for this repository only, with Contents read and
# write and nothing else (the organization keeps GITHUB_TOKEN read-only).
# Secrets never reach pull_request runs, and this workflow runs only on
# main. Its commit changes only README.md, docs/progress and
# tools/unported-commands, which CI and this workflow ignore, so it starts
# no further runs.
on:
  push:
    branches: [main]
    paths:
      - "src/**.f90"
      - "docs/status/**"
      - tools/status.sh
      - tools/progress.sh
      - tools/package-totals
      - tools/ported-packages
      # What tools/unported-commands.sh reads: the commands (made from src/
      # by tools/gen-commands.sh) and the Fortran names of upstream's.
      - tools/unported-commands.sh
      - tools/gen-commands.sh
      - tools/build.sh
      - "tools/fortran-names.d/**"
      - tools/fortran-names.sh
      - tools/fortran-names.awk
      - tools/fortran-names-lib.awk
      - tools/fortran-names-clash.awk
      - .github/workflows/progress.yml
  workflow_dispatch:

# One update at a time.
concurrency:
  group: progress
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the token
        env:
          PROGRESS_TOKEN: ${{ secrets.PROGRESS_TOKEN }}
        run: |
          if [ -z "$PROGRESS_TOKEN" ]; then
            echo "::error title=PROGRESS_TOKEN missing::add the repository secret PROGRESS_TOKEN (see .github/workflows/progress.yml)"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PROGRESS_TOKEN }}

      - name: Fetch upstream
        run: tools/fetch-upstream.sh

      - name: Update the progress block
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Another merge may land while this runs: redo the update on the
          # new main and try again.
          for attempt in 1 2 3; do
            tools/progress.sh --update-readme
            tools/status.sh --index >docs/progress/status-index.md
            # It runs tools/build.sh --generate for src/commands_mod.f90
            # (awk only: neither fpm nor gfortran is needed).
            tools/unported-commands.sh
            # Added first, so that a new file (the first index) counts.
            git add README.md docs/progress tools/unported-commands
            if git diff --cached --quiet; then
              echo "The progress block and the unported commands are current."
              exit 0
            fi
            git commit -q -m "Progress: update the README block, status index and unported commands"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error title=Progress not pushed::main refused the push; run tools/progress.sh --update-readme and tools/unported-commands.sh on main by hand"
          exit 1
